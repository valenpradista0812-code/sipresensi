<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifikasi - SiPresensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/shared.css">
</head>
<body class="admin">
<div class="app">

  <div id="sidebar-container"></div>


  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Notifikasi</h1>
      <div class="topbar-right">
        <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Cari siswa, guru, kelas..."></label>
        <a class="bell" href="/src/pages/admin/notifikasi.html" aria-label="Notifikasi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
        <div class="user">
          <div class="avatar"><svg viewBox="0 0 40 40" role="img" aria-label="Foto Hj. Endang Triwati"><rect width="40" height="40" fill="#cbd5e1"/><path d="M6 40c1-9 7-13 14-13s13 4 14 13z" fill="#1f2937"/><ellipse cx="20" cy="17" rx="10" ry="11" fill="#1f2937"/><ellipse cx="20" cy="18" rx="6.5" ry="7.5" fill="#f1c9a5"/><path d="M13.5 15c2-4 11-4 13 0-3-1.5-10-1.5-13 0z" fill="#1f2937"/></svg></div>
          <div>
            <div class="user-name">Hj. Endang Triwati</div>
            <div class="user-role">Admin Kepegawaian</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <span class="toolbar-desc">Kelola notifikasi sistem dan laporan pelacakan sekolah</span>
        <button class="btn btn-outline" type="button">Tandai Semua Dibaca</button>
      </div>
      <section class="card notif-list" id="notif-list-container">
        <div style="text-align:center; padding:32px; color:#64748b;">Memuat notifikasi...</div>
      </section>
    </main>
  </div>

</div>
<script src="/src/js/script.js"></script>
<script src="/src/js/app-core.js"></script>
<script>
  (async function() {
    const container = document.getElementById('notif-list-container');
    const btnMarkAll = document.querySelector('.toolbar .btn-outline');

    async function loadNotifikasi() {
      container.innerHTML = '<div style="text-align:center; padding:32px; color:#64748b;">Memuat notifikasi dari database...</div>';
      try {
        const res = await fetch('/api/notifikasi');
        const json = await res.json();
        if (json.success) {
          renderNotifikasi(json.data);
        } else {
          container.innerHTML = '<div style="text-align:center; padding:32px; color:#ef4444;">Gagal memuat notifikasi.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align:center; padding:32px; color:#ef4444;">Gagal terhubung ke server backend.</div>';
      }
    }

    function renderNotifikasi(list) {
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:48px 20px; color:#64748b;">
            <svg style="width:48px; height:48px; margin-bottom:12px; color:#94a3b8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <div style="font-weight:600; font-size:15px; color:#334155;">Tidak Ada Notifikasi</div>
            <div style="font-size:13px; color:#94a3b8; margin-top:4px;">Semua notifikasi sistem telah terbaca atau belum ada notifikasi baru.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notif';

        const txt = ((item.title || '') + ' ' + (item.text || '')).toLowerCase();
        let color = 'blue';
        if (txt.includes('tidak hadir') || txt.includes('alfa') || txt.includes('peringatan') || txt.includes('error')) {
          color = 'red';
        } else if (txt.includes('belum diisi') || txt.includes('toleransi') || txt.includes('terlambat') || txt.includes('izin')) {
          color = 'amber';
        }

        const iconSvg = color === 'red'
          ? `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
          : color === 'amber'
          ? `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
          : `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

        div.innerHTML = `
          <span class="notif-icon ${color}">${iconSvg}</span>
          <div class="notif-body">
            <div class="notif-title"><strong>${escapeHtml(item.title || '')}</strong>${item.text ? ' - ' + escapeHtml(item.text) : ''}</div>
            <div class="notif-time">${item.time || 'Baru saja'}</div>
          </div>
          ${item.unread ? '<span class="notif-dot"></span>' : ''}
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    if (btnMarkAll) {
      btnMarkAll.addEventListener('click', async () => {
        try {
          const res = await fetch('/api/notifikasi/read-all', { method: 'POST' });
          const json = await res.json();
          if (json.success) {
            document.querySelectorAll('.notif-dot').forEach(d => d.remove());
            if (window.SiPresensi && SiPresensi.showToast) {
              SiPresensi.showToast('Semua notifikasi ditandai sudah dibaca.', 'success');
            }
          }
        } catch (e) {
          console.warn('Gagal menandai notifikasi dibaca:', e);
        }
      });
    }

    loadNotifikasi();
  })();
</script>
<script src="/src/js/sidebar-loader.js"></script>
</body>
</html>
