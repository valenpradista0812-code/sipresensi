<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan - SiPresensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/shared.css">
</head>
<body class="admin">
<div class="app">

  <div id="sidebar-container"></div>
  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Pengaturan</h1>
      <div class="topbar-right">
        <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Cari siswa, guru, kelas..."></label>
        <a class="bell" href="/src/pages/admin/notifikasi.html" aria-label="Notifikasi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
        <div class="user">
          <div class="avatar"><svg viewBox="0 0 40 40" role="img" aria-label="Foto Hj. Endang Triwati"><rect width="40" height="40" fill="#cbd5e1"/><path d="M6 40c1-9 7-13 14-13s13 4 14 13z" fill="#1f2937"/><ellipse cx="20" cy="17" rx="10" ry="11" fill="#1f2937"/><ellipse cx="20" cy="18" rx="6.5" ry="7.5" fill="#f1c9a5"/><path d="M13.5 15c2-4 11-4 13 0-3-1.5-10-1.5-13 0z" fill="#1f2937"/></svg></div>
          <div>
            <div class="user-name">Hj. Endang Triwati</div>
            <div class="user-role">Admin Kepegawaian</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="settings">
        <section class="card set-card">
          <h2 class="set-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg>Pengaturan Umum</h2>
          <div class="set-field"><label class="label" for="sekolah">Nama Sekolah</label><input class="input readonly" id="sekolah" type="text" value="SMA Negeri 1 Jakarta" readonly></div>
          <div class="set-field"><label class="label" for="ta">Tahun Ajaran Aktif</label><input class="input" id="ta" type="text" value="2024/2025 Ganjil"></div>
        </section>
        <section class="card set-card">
          <h2 class="set-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Konfigurasi Notifikasi</h2>
          <div class="set-row"><span class="set-label">Kirim Email Notifikasi Ke Orang Tua</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="Email notifikasi ke orang tua"></button></div>
          <div class="set-row"><span class="set-label">Kirim Whatsapp Rekap Harian</span><button class="toggle" type="button" role="switch" aria-checked="false" aria-label="Whatsapp rekap harian"></button></div>
        </section>
        <section class="card set-card">
          <h2 class="set-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Kebijakan Absensi</h2>
          <div class="set-field"><label class="label" for="jam">Jam Masuk Default</label><input class="input" id="jam" type="text" value="07:00 WIB"></div>
          <div class="set-field"><label class="label" for="jam-pulang">Jam Pulang Default</label><input class="input" id="jam-pulang" type="text" value="15:00 WIB"></div>
          <div class="set-field"><label class="label" for="tol">Batas Toleransi Keterlambatan</label><input class="input" id="tol" type="text" value="15 Menit"></div>
        </section>
        <section class="card set-card">
          <h2 class="set-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>Sistem &amp; Pemeliharaan</h2>
          <div class="set-row"><span class="set-label">Bahasa Antarmuka</span><span class="chip">Bahasa Indonesia</span></div>
          <div class="set-row"><span class="set-label">Pencadangan Basis Data</span><button class="btn btn-outline-green" type="button">Cadangkan Sekarang</button></div>
        </section>
        <section class="card set-card">
          <h2 class="set-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Keamanan &amp; Kata Sandi</h2>
          <form id="form-change-password-settings">
            <div class="set-field"><label class="label" for="sp-old-pass">Kata Sandi Saat Ini</label><input class="input" id="sp-old-pass" type="password" placeholder="Masukkan kata sandi lama..." required></div>
            <div class="set-field"><label class="label" for="sp-new-pass">Kata Sandi Baru</label><input class="input" id="sp-new-pass" type="password" minlength="5" placeholder="Minimal 5 karakter..." required></div>
            <div class="set-field"><label class="label" for="sp-confirm-pass">Konfirmasi Kata Sandi Baru</label><input class="input" id="sp-confirm-pass" type="password" minlength="5" placeholder="Ulangi kata sandi baru..." required></div>
            <div style="margin-top:14px; display:flex; justify-content:flex-end;">
              <button class="btn btn-primary" id="btn-save-new-pass" type="submit">Perbarui Kata Sandi</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

</div>
<script src="/src/js/sidebar-loader.js"></script>
<script src="/src/js/script.js"></script>
<script src="/src/js/app-core.js"></script>
<script>
  (function() {
    const taInput = document.getElementById('ta');
    const jamInput = document.getElementById('jam');
    const jamPulangInput = document.getElementById('jam-pulang');
    const tolInput = document.getElementById('tol');
    const toggles = document.querySelectorAll('.toggle');
    const btnBackup = document.querySelector('.btn-outline-green');

    async function loadSettings() {
      try {
        const res = await fetch('/api/pengaturan');
        const json = await res.json();
        if (json.success && json.data) {
          const d = json.data;
          if (taInput) taInput.value = d.ta || '2024/2025 Ganjil';
          if (jamInput) jamInput.value = d.jamMasuk || '07:00 WIB';
          if (jamPulangInput) jamPulangInput.value = d.jamPulang || '15:00 WIB';
          if (tolInput) tolInput.value = d.toleransi || '15 Menit';
          if (toggles[0]) {
            if (d.emailNotif) toggles[0].classList.add('on');
            else toggles[0].classList.remove('on');
          }
          if (toggles[1]) {
            if (d.whatsappRekap) toggles[1].classList.add('on');
            else toggles[1].classList.remove('on');
          }
        }
      } catch (e) {}
    }

    async function saveSettings() {
      const payload = {
        ta: taInput ? taInput.value : '',
        jamMasuk: jamInput ? jamInput.value : '',
        jamPulang: jamPulangInput ? jamPulangInput.value : '',
        toleransi: tolInput ? tolInput.value : '',
        emailNotif: toggles[0] ? toggles[0].classList.contains('on') : true,
        whatsappRekap: toggles[1] ? toggles[1].classList.contains('on') : false
      };
      try {
        const res = await fetch('/api/pengaturan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.message || 'Gagal menyimpan pengaturan.');
        }
        SiPresensi.showToast('Pengaturan berhasil disimpan!', 'success');
      } catch (err) {
        SiPresensi.showToast(err.message || 'Gagal terhubung ke server.', 'error');
      }
    }

    [taInput, jamInput, jamPulangInput, tolInput].forEach(inp => {
      if (inp) inp.addEventListener('change', saveSettings);
    });

    toggles.forEach(t => {
      t.addEventListener('click', () => setTimeout(saveSettings, 50));
    });

    if (btnBackup) {
      btnBackup.addEventListener('click', () => {
        SiPresensi.showToast('Basis data SiPresensi berhasil dicadangkan!', 'success');
      });
    }

    const formChangePass = document.getElementById('form-change-password-settings');
    if (formChangePass) {
      formChangePass.addEventListener('submit', async (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById('sp-old-pass').value;
        const newPassword = document.getElementById('sp-new-pass').value;
        const confirmPassword = document.getElementById('sp-confirm-pass').value;

        if (newPassword !== confirmPassword) {
          SiPresensi.showToast('Konfirmasi kata sandi baru tidak cocok!', 'error');
          return;
        }

        const btnSave = document.getElementById('btn-save-new-pass');
        btnSave.disabled = true;
        btnSave.textContent = 'Menyimpan...';

        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
          });
          const json = await res.json();
          if (json.success) {
            SiPresensi.showToast(json.message || 'Kata sandi berhasil diperbarui!', 'success');
            formChangePass.reset();
          } else {
            SiPresensi.showToast(json.message || 'Gagal mengubah kata sandi.', 'error');
          }
        } catch (err) {
          SiPresensi.showToast('Gagal terhubung ke server.', 'error');
        } finally {
          btnSave.disabled = false;
          btnSave.textContent = 'Perbarui Kata Sandi';
        }
      });
    }

    loadSettings();
  })();
</script>
</body>
</html>
