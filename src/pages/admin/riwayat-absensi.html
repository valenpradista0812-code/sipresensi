<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Absensi - SiPresensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/shared.css">
</head>
<body class="admin">
<div class="app">

  <div id="sidebar-container"></div>


  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Riwayat Absensi</h1>
      <div class="topbar-right">
        <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Cari siswa, guru, kelas..."></label>
        <a class="bell" href="/src/pages/admin/notifikasi.html" aria-label="Notifikasi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
        <div class="user">
          <div class="avatar"><svg viewBox="0 0 40 40" role="img" aria-label="Foto Hj. Endang Triwati"><rect width="40" height="40" fill="#cbd5e1"/><path d="M6 40c1-9 7-13 14-13s13 4 14 13z" fill="#1f2937"/><ellipse cx="20" cy="17" rx="10" ry="11" fill="#1f2937"/><ellipse cx="20" cy="18" rx="6.5" ry="7.5" fill="#f1c9a5"/><path d="M13.5 15c2-4 11-4 13 0-3-1.5-10-1.5-13 0z" fill="#1f2937"/></svg></div>
          <div>
            <div class="user-name">Hj. Endang Triwati</div>
            <div class="user-role">Admin Kepegawaian</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="toolbar-left">
          <!-- Filter Tanggal Interaktif -->
          <div class="select date" style="display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:#fff;">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input type="date" id="filter-riwayat-date" value="" title="Pilih tanggal tertentu" style="border:none; background:transparent; font:inherit; font-size:12px; font-weight:600; color:var(--text); outline:none; cursor:pointer;">
            <button type="button" id="btn-clear-date" title="Tampilkan Semua Tanggal" style="background:#f1f5f9; border:none; border-radius:4px; color:#64748b; font-size:11px; font-weight:600; cursor:pointer; padding:2px 8px;">Semua</button>
          </div>

          <!-- Filter Kelas Interaktif -->
          <div class="select" style="padding:0; border:1px solid var(--border); background:#fff; overflow:hidden;">
            <select id="filter-riwayat-kelas" style="border:none; background:transparent; padding:8px 14px; font:inherit; font-size:12px; font-weight:600; color:var(--text); outline:none; cursor:pointer;">
              <option value="Semua Kelas">Semua Kelas</option>
              <option value="XII IPA 1">XII IPA 1</option>
              <option value="XII IPA 2">XII IPA 2</option>
              <option value="XII IPS 1">XII IPS 1</option>
              <option value="XI IPA 1">XI IPA 1</option>
              <option value="XI IPS 1">XI IPS 1</option>
              <option value="XI IPS 2">XI IPS 2</option>
              <option value="X IPA 1">X IPA 1</option>
              <option value="X IPA 2">X IPA 2</option>
              <option value="X IPS 1">X IPS 1</option>
            </select>
          </div>

          <!-- Input Pencarian Cepat -->
          <input type="text" id="search-riwayat-input" placeholder="Cari mata pelajaran atau guru..." style="padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:12px; outline:none; min-width:200px; background:#fff;">
        </div>
        <div class="toolbar-right">
          <button class="btn btn-outline" id="btn-export-excel" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>Export Excel</button>
          <button class="btn btn-primary" id="btn-export-pdf" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>Export PDF</button>
        </div>
      </div>
      <section class="card table-card">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Tanggal</th><th>Kelas</th><th>Mata Pelajaran</th><th>Guru Pengampu</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th><th class="right">Total Siswa</th></tr></thead>
            <tbody id="riwayat-tbody">
              <tr><td colspan="9" style="text-align:center; padding:24px; color:#64748b;">Memuat riwayat absensi...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="riwayat-foot-count">Menampilkan data riwayat absensi kelas</span>
          <div class="pager" id="riwayat-pager">
            <button type="button" class="active" data-page="1">1</button>
          </div>
        </div>
      </section>
    </main>
  </div>

</div>
<script src="/src/js/sidebar-loader.js"></script>
<script src="/src/js/script.js"></script>
<script src="/src/js/app-core.js"></script>
<script>
  (function() {
    const tbody = document.getElementById('riwayat-tbody');
    const filterDate = document.getElementById('filter-riwayat-date');
    const btnClearDate = document.getElementById('btn-clear-date');
    const filterKelas = document.getElementById('filter-riwayat-kelas');
    const searchInput = document.getElementById('search-riwayat-input');
    const topSearch = document.querySelector('header .search input');
    const footCount = document.getElementById('riwayat-foot-count');
    const btnExcel = document.getElementById('btn-export-excel');
    const btnPdf = document.getElementById('btn-export-pdf');

    let currentData = [];

    async function loadRiwayat() {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:24px; color:#64748b;">Memuat riwayat absensi...</td></tr>';

      const kelas = filterKelas.value;
      const tanggal = filterDate.value;
      const q = (searchInput.value || (topSearch ? topSearch.value : '')).trim();

      const params = new URLSearchParams();
      if (kelas && kelas !== 'Semua Kelas') params.append('kelas', kelas);
      if (tanggal) params.append('tanggal', tanggal);
      if (q) params.append('q', q);

      try {
        const res = await fetch(`/api/absensi/riwayat?${params.toString()}`);
        const json = await res.json();
        if (json.success) {
          currentData = json.data;
          renderTable(currentData);
        } else {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:24px; color:#ef4444;">Gagal memuat data.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:24px; color:#ef4444;">Gagal terhubung ke backend server.</td></tr>';
      }
    }

    function renderTable(list) {
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:24px; color:#64748b;">Tidak ada data riwayat absensi yang cocok dengan filter.</td></tr>';
        footCount.textContent = 'Menampilkan 0 riwayat absensi';
        return;
      }

      tbody.innerHTML = '';
      list.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.tanggal || item.date}</td>
          <td class="bold">${item.kelas}</td>
          <td>${item.mapel}</td>
          <td>${item.guru}</td>
          <td><span class="num n-hadir">${item.hadir}</span></td>
          <td><span class="num n-izin">${item.izin}</span></td>
          <td><span class="num n-sakit">${item.sakit}</span></td>
          <td><span class="num ${item.alfa > 0 ? 'n-alfa' : 'n-zero'}">${item.alfa}</span></td>
          <td class="right bold">${item.total}</td>
        `;
        tbody.appendChild(tr);
      });

      footCount.textContent = `Menampilkan ${list.length} riwayat absensi kelas`;
    }

    // Filter event listeners
    filterDate.addEventListener('change', loadRiwayat);
    btnClearDate.addEventListener('click', () => {
      filterDate.value = '';
      loadRiwayat();
    });
    filterKelas.addEventListener('change', loadRiwayat);
    searchInput.addEventListener('input', () => {
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(loadRiwayat, 300);
    });
    if (topSearch) {
      topSearch.addEventListener('input', () => {
        searchInput.value = topSearch.value;
        clearTimeout(window._searchTimer);
        window._searchTimer = setTimeout(loadRiwayat, 300);
      });
    }

    // Export Excel (CSV format)
    if (btnExcel) {
      btnExcel.addEventListener('click', () => {
        if (currentData.length === 0) {
          if (window.SiPresensi) window.SiPresensi.showToast('Tidak ada data untuk diekspor.', 'error');
          return;
        }

        const headers = ['Tanggal', 'Kelas', 'Mata Pelajaran', 'Guru Pengampu', 'Hadir', 'Izin', 'Sakit', 'Alfa', 'Total Siswa'];
        const rows = currentData.map(d => [
          `"${d.tanggal || d.date}"`,
          `"${d.kelas}"`,
          `"${d.mapel}"`,
          `"${d.guru}"`,
          d.hadir,
          d.izin,
          d.sakit,
          d.alfa,
          d.total
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `riwayat-absensi-${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        if (window.SiPresensi) window.SiPresensi.showToast('Data riwayat absensi berhasil diekspor ke Excel (CSV)!', 'success');
      });
    }

    // Export PDF
    if (btnPdf) {
      btnPdf.addEventListener('click', () => {
        if (window.SiPresensi) window.SiPresensi.showToast('Menyiapkan dokumen cetak PDF...', 'success');
        setTimeout(() => window.print(), 300);
      });
    }

    loadRiwayat();
  })();
</script>
</body>
</html>
