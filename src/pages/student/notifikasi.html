<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifikasi Siswa - SiPresensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/shared.css">
  <link rel="stylesheet" href="/public/styles/student-glass-sidebar.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="siswa student-glass-page">
<div class="app">
  <div id="sidebar-container"></div>

  <div class="main">
    <main class="content">
      <header class="student-page-header">
        <h2 id="greeting-title">Selamat Pagi, Rizky Pratama!</h2>
        <p id="greeting-subtitle">Hari ini: Sistem presensi geo-tagging mencatat kehadiranmu dengan akurat.</p>
      </header>
      <h1 class="student-page-title">Notifikasi</h1>
      <div class="toolbar">
        <span class="toolbar-desc">Pemberitahuan presensi dan catatan akademik terbaru</span>
        <button class="btn btn-outline" type="button" id="btn-mark-read">Tandai Semua Dibaca</button>
      </div>
      <section class="card notif-list" id="notif-list-container">
        <div style="text-align:center; padding:32px; color:#64748b;">Memuat notifikasi...</div>
      </section>
    </main>
  </div>

</div>
<script src="/src/js/student-glass-sidebar.js"></script>
<script src="/public/components/student/greeting.js"></script>
<script src="/src/js/script.js"></script>
<script src="/src/js/app-core.js"></script>
<script src="/src/js/script-siswa.js"></script>
<script>
  (async function() {
    const container = document.getElementById('notif-list-container');
    const markReadButton = document.getElementById('btn-mark-read');
    const storedName = sessionStorage.getItem('student_name');
    StudentGreeting.init({ name: storedName || 'Rizky Pratama' });

    async function loadNotifikasi() {
      container.innerHTML = '<div style="text-align:center; padding:32px; color:#64748b;">Memuat notifikasi dari database...</div>';
      try {
        const res = await fetch('/api/notifikasi');
        const json = await res.json();
        if (json.success) {
          renderNotifikasi(json.data);
        } else {
          container.innerHTML = '<div style="text-align:center; padding:32px; color:#ef4444;">Gagal memuat notifikasi.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align:center; padding:32px; color:#ef4444;">Gagal terhubung ke server backend.</div>';
      }
    }

    markReadButton.addEventListener('click', async () => {
      markReadButton.disabled = true;
      try {
        const res = await fetch('/api/notifikasi/read-all', { method: 'POST' });
        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.message || 'Gagal menandai notifikasi sebagai sudah dibaca.');
        }
        await loadNotifikasi();
        SiPresensi.showToast('Semua notifikasi ditandai sudah dibaca.', 'success');
      } catch (error) {
        SiPresensi.showToast(error.message || 'Gagal terhubung ke server backend.', 'error');
      } finally {
        markReadButton.disabled = false;
      }
    });

    function renderNotifikasi(list) {
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:48px 20px; color:#64748b;">
            <svg style="width:48px; height:48px; margin-bottom:12px; color:#94a3b8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <div style="font-weight:600; font-size:15px; color:#334155;">Tidak Ada Notifikasi</div>
            <div style="font-size:13px; color:#94a3b8; margin-top:4px;">Semua notifikasi presensi dan akademik Anda telah terbaca.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notif';

        const txt = ((item.title || '') + ' ' + (item.text || '')).toLowerCase();
        let color = 'blue';
        if (txt.includes('terlambat') || txt.includes('izin') || txt.includes('sakit')) {
          color = 'amber';
        }

        const iconSvg = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

        div.innerHTML = `
          <span class="notif-icon ${color}">${iconSvg}</span>
          <div class="notif-body">
            <div class="notif-title">${escapeHtml(item.title || 'Informasi Presensi')}</div>
            <div class="notif-text">${escapeHtml(item.text || item.message || '')}</div>
            <div class="notif-time">${escapeHtml(item.time || item.created_at || 'Baru saja')}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    loadNotifikasi();
  })();
</script>
</body>
</html>
